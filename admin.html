<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead Finder · Device Control</title>
<link rel="icon" href="/favicon.png" type="image/png">
<style>
  :root { --bg:#070B14; --card:rgba(255,255,255,0.04); --border:rgba(255,255,255,0.08); --teal:#0ABAB5; --teal2:#22D3EE; --txt:#E2E8F0; --dim:#64748B; --red:#F87171; --green:#34D399; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100vh; }
  .wrap { max-width:720px; margin:0 auto; padding:32px 20px 60px; }
  header { display:flex; align-items:center; gap:14px; margin-bottom:28px; }
  header img { width:42px; height:42px; object-fit:contain; }
  header h1 { font-size:17px; font-weight:700; letter-spacing:0.08em; }
  header h1 span { color:var(--teal); }
  header .sub { display:block; font-size:11px; color:var(--dim); font-weight:400; letter-spacing:0.14em; margin-top:2px; }
  .domain { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:var(--teal2); background:rgba(10,186,181,0.08); border:1px solid rgba(10,186,181,0.25); padding:6px 12px; border-radius:8px; display:inline-block; margin-bottom:18px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:18px; backdrop-filter:blur(8px); }
  .label { font-size:10px; font-weight:700; letter-spacing:0.16em; color:var(--dim); text-transform:uppercase; margin-bottom:8px; }
  input[type=password], input[type=text] { width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:10px; padding:12px 14px; color:var(--txt); font-size:14px; outline:none; transition:border .2s; }
  input:focus { border-color:var(--teal); }
  .row { display:flex; gap:10px; }
  .row input { flex:1; }
  button { background:linear-gradient(135deg,var(--teal),var(--teal2)); border:none; color:#fff; font-weight:700; font-size:13px; letter-spacing:0.06em; padding:12px 20px; border-radius:10px; cursor:pointer; white-space:nowrap; transition:filter .2s; }
  button:hover { filter:brightness(1.12); }
  button.danger { background:rgba(248,113,113,0.12); color:var(--red); border:1px solid rgba(248,113,113,0.3); }
  button.danger:hover { background:rgba(248,113,113,0.2); }
  button.sm { padding:7px 12px; font-size:11px; border-radius:8px; }
  button:disabled { opacity:0.4; cursor:not-allowed; }
  .msg { font-size:12px; margin-top:12px; min-height:18px; }
  .msg.err { color:var(--red); }
  .msg.ok { color:var(--green); }
  .empty { text-align:center; color:var(--dim); font-size:13px; padding:28px 0 8px; }
  .dev { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); }
  .dev:last-child { border-bottom:none; }
  .dev .name { font-size:14px; font-weight:600; }
  .dev .meta { font-size:11px; color:var(--dim); margin-top:3px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .dev .ts { font-size:11px; color:var(--dim); margin-top:3px; }
  .badge { display:inline-block; font-size:10px; padding:2px 8px; border-radius:20px; background:rgba(52,211,153,0.12); color:var(--green); border:1px solid rgba(52,211,153,0.3); margin-bottom:12px; letter-spacing:0.1em; }
  .count { font-size:12px; color:var(--dim); }
  .foot { text-align:center; font-size:11px; color:var(--dim); margin-top:32px; letter-spacing:0.08em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="/logo.png" alt="Lead Finder">
    <h1>DEVICE <span>CONTROL</span><span class="sub">SELLER ADMIN · DEVICE UNLOCK</span></h1>
  </header>

  <div class="domain" id="domain">MANAGING · <span id="hostname"></span></div>

  <div class="card">
    <div class="label">Admin Key</div>
    <div class="row">
      <input type="password" id="adminkey" placeholder="••••••••••••••••" autocomplete="off">
      <button onclick="loadDevices()">LOAD ▶</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card" id="listCard" style="display:none">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
      <div class="label" style="margin-bottom:0;">Bound Devices</div>
      <span class="count" id="count"></span>
    </div>
    <div id="devlist"></div>
    <div style="margin-top:18px; display:flex; justify-content:flex-end;">
      <button class="danger" onclick="resetAll()">✕ CLEAR ALL DEVICES</button>
    </div>
  </div>

  <div class="foot">LEAD FINDER · DEVICE LOCK v1 · 2-DEVICE LIMIT PER ACCOUNT</div>
</div>

<script>
const API = '/api/device';
let key = '';

(function boot() {
  document.getElementById('hostname').textContent = location.hostname;
  try { key = sessionStorage.getItem('lf_admin_key') || ''; } catch (e) {}
  if (key) {
    document.getElementById('adminkey').value = key;
    loadDevices();
  }
})();

function msg(t, ok) {
  const el = document.getElementById('msg');
  el.textContent = t || '';
  el.className = 'msg ' + (ok ? 'ok' : (t ? 'err' : ''));
}

async function api(mode, params, body) {
  const qs = new URLSearchParams({ mode: mode, ...(params || {}) });
  const opt = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { method: 'POST' };
  const r = await fetch(API + '?' + qs.toString(), opt);
  return r.json();
}

async function loadDevices() {
  const inp = document.getElementById('adminkey').value.trim();
  if (!inp) { msg('ENTER ADMIN KEY'); return; }
  key = inp;
  try { sessionStorage.setItem('lf_admin_key', key); } catch (e) {}
  const btn = document.querySelector('#listCard button, header button');
  try {
    const j = await api('list', { admin: key });
    if (j.error === 'forbidden') { msg('✖ WRONG ADMIN KEY'); return; }
    if (j.error) { msg('✖ ' + j.error); return; }
    render(j.devices || [], j.max || 2);
    msg('✔ LOADED', true);
  } catch (e) {
    msg('✖ NETWORK ERROR — ' + e.message);
  }
}

function render(devices, max) {
  const card = document.getElementById('listCard');
  const list = document.getElementById('devlist');
  card.style.display = 'block';
  document.getElementById('count').textContent = devices.length + ' / ' + max + ' DEVICES';
  if (!devices.length) {
    list.innerHTML = '<div class="empty">NO DEVICES BOUND — 客户首次登录会自动绑定</div>';
    return;
  }
  list.innerHTML = devices.map((d) => {
    const id = (d.id || '').slice(0, 14);
    return '<div class="dev">' +
      '<div>' +
        '<div class="name">' + esc(d.label || 'Unknown device') + '</div>' +
        '<div class="meta">' + esc(id) + '…</div>' +
        '<div class="ts">' + fmt(d.firstSeen) + ' · last ' + fmt(d.lastSeen) + '</div>' +
      '</div>' +
      '<button class="sm danger" onclick="kick(\'' + esc(d.id) + '\')">KICK</button>' +
    '</div>';
  }).join('');
}

async function kick(id) {
  if (!confirm('Kick this device? 这台设备将需要重新登录绑定。')) return;
  const j = await api('remove', { admin: key, id: id });
  if (j.ok) { loadDevices(); msg('✔ DEVICE KICKED', true); }
  else msg('✖ FAILED — ' + (j.error || ''));
}

async function resetAll() {
  if (!confirm('CLEAR ALL devices? 所有设备都要重新登录绑定。确定？')) return;
  const j = await api('reset', { admin: key });
  if (j.ok) { loadDevices(); msg('✔ ALL DEVICES CLEARED', true); }
  else msg('✖ FAILED — ' + (j.error || ''));
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmt(ts) {
  if (!ts) return '—';
  try { return new Date(ts).toLocaleString('en-MY', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); }
  catch (e) { return '—'; }
}
</script>
</body>
</html>
